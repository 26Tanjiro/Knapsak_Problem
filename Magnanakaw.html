<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Selection</title>
</head>
<body>
    <link rel="stylesheet" href="Magnanakaw.css">
    <div class="container-input">
    <h3>Select Items</h3>
    <select id="itemselect1">
        <option value="">Select Item 1</option>
        <option value="item1">Item 1</option>
        <option value="item2">Item 2</option>
        <option value="item3">Item 3</option>
    </select>

    <select id="itemselect2">
        <option value="">Select Item 2</option>
        <option value="item1">Item 1</option>
        <option value="item2">Item 2</option>
        <option value="item3">Item 3</option>
    </select>

    <button id="Submit">Submit</button>
    </div>

    <div class="container-Selection">
        <label class="selection">Selection</label>
        <table class="item-table">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Weight</th>
                    <th>Value</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Item 1</td>
                    <td>1kg</td>
                    <td>10 pesos</td>
                </tr>
                <tr>
                    <td>Item 2</td>
                    <td>2kg</td>
                    <td>15 pesos</td>
                </tr>
                <tr>
                    <td>Item 3</td>
                    <td>3kg</td>
                    <td>40 pesos</td>
                </tr>
            </tbody>
        </table>
        <p>You can only pick one item at the time!!</p>
    </div>
